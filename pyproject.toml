[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linum"
version = "0.1.0"
description = "Linum compiler toolchain and linear resource tracking engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["linum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["..", "."]
